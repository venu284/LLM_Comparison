<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-011 Flip Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e2e8f0;
        font-family: sans-serif;
      }

      .flip-card {
        width: 300px;
        height: 200px;
        perspective: 1000px;
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 600ms ease;
      }

      .flip-card:hover .flip-card-inner {
        transform: rotateY(180deg);
      }

      .flip-card-front,
      .flip-card-back {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        color: #ffffff;
        backface-visibility: hidden;
      }

      .flip-card-front {
        background: #2563eb;
      }

      .flip-card-back {
        background: #16a34a;
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div class="flip-card">
      <div class="flip-card-inner">
        <div class="flip-card-front">Front Side</div>
        <div class="flip-card-back">Back Side</div>
      </div>
    </div>
  </body>
</html>
