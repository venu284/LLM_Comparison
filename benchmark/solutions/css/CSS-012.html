<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS-012 Accordion</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
        font-family: sans-serif;
        background: #f8fafc;
      }

      .accordion {
        max-width: 640px;
        margin: 0 auto;
        border: 1px solid #d1d5db;
        border-bottom: none;
        background: #ffffff;
      }

      .accordion input[type="radio"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .section-label {
        display: block;
        padding: 16px 20px;
        border-bottom: 1px solid #d1d5db;
        cursor: pointer;
        transition: background 200ms ease;
      }

      .content {
        max-height: 0;
        overflow: hidden;
        padding: 0 20px;
        border-bottom: 1px solid #d1d5db;
        transition: max-height 80ms ease, padding 80ms ease;
      }

      .accordion input[type="radio"]:checked + .section-label {
        font-weight: 700;
        background: #e0f2fe;
      }

      .accordion input[type="radio"]:checked + .section-label + .content {
        max-height: 160px;
        padding: 16px 20px;
      }
    </style>
  </head>
  <body>
    <div class="accordion">
      <div class="section">
        <input id="section-1" type="radio" name="accordion" />
        <label class="section-label" for="section-1">Section 1</label>
        <div class="content">Accordion content one.</div>
      </div>
      <div class="section">
        <input id="section-2" type="radio" name="accordion" />
        <label class="section-label" for="section-2">Section 2</label>
        <div class="content">Accordion content two.</div>
      </div>
      <div class="section">
        <input id="section-3" type="radio" name="accordion" />
        <label class="section-label" for="section-3">Section 3</label>
        <div class="content">Accordion content three.</div>
      </div>
    </div>
  </body>
</html>
